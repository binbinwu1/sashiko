log_level = "info"

[database]
url = "sashiko.db"
token = ""

[mailing_lists]
track = ["linux-kernel"]

[nntp]
server = "nntp.lore.kernel.org"
port = 119

# [smtp]
# **WARNING: BE VERY CAREFUL WHEN ENABLING EMAIL SENDING.**
# Sashiko can easily generate and send a large volume of automated emails to
# public mailing lists, potentially causing disruption or being marked as spam.
# Ensure your filters and dry_run settings are correctly configured before use.
# server = "smtp.example.com"
# port = 587
# username = "user@example.com"
# password = "your_password"
# sender_address = "sashiko@example.com"
# dry_run = true

[ai]
provider = "omlx"
#model = "Qwen3.5-27B-Claude-4.6-Opus-Distilled-MLX-6bit"
model = "Qwen3.5-122B-A10B-4bit"
max_input_tokens = 200000
max_interactions = 50
temperature = 1.0

[ai.claude]
prompt_caching = true

[ai.omlx]
base_url = "http://127.0.0.1:8000/v1/chat/completions"
context_window_size = 262144
max_tokens = 200000
api_timeout_secs = 1200

[server]
host = "127.0.0.1"
port = 8080

[git]
repository_path = "/Volumes/workspace/linux"

[review]
# reduce the concurrency for API or local performance limits
concurrency = 1
worktree_dir = "review_trees"
timeout_seconds = 7200
max_retries = 3
ignore_files = ["MAINTAINERS", ".mailmap", ".gitignore", "LICENSES/"]